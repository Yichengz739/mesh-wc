<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>選擇廁所 | BLE Mesh</title>

  <style>
    :root {
      --bg-main: #eef2f6; --bg-panel: #ffffff; 
      --text-main: #1e293b; --text-muted: #64748b;
      --border-light: #e2e8f0;
    }
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
    }
    
    /* 3 欄網格佈局：Sidebar | Main | 可收合 AI 欄 */
    .dashboard-layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) 64px;
      height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 0 50px rgba(0,0,0,0.05);
      overflow: hidden;
      transition: grid-template-columns 0.32s cubic-bezier(.4,0,.2,1);
    }

    .dashboard-layout.ai-expanded {
      grid-template-columns: 250px minmax(0, 1fr) 360px;
    }
    
    /* === 與其他頁面統一的 Sidebar 樣式 === */
    .sidebar {
      background: #fff;
      border-right: 1px solid var(--border-light);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 32px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; line-height: 1; }
    .brand-sub { font-size: 12px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted); margin-top: 8px; font-weight: 600; }
    
    .menu { display: flex; flex-direction: column; gap: 8px; }
    .menu-item { text-decoration: none; color: #475569; display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600; padding: 12px 16px; border-radius: 12px; transition: all 0.2s ease; }
    .menu-item:hover { background: #f1f5f9; color: #0f172a; }
    .menu-item.active { background: #0f172a; color: #fff; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.3); }

    .sidebar-footer { margin-top: auto; }
    .logout-divider { border-top: 1px solid var(--border-light); margin-bottom: 24px; }
    .logout { font-size: 18px; font-weight: 700; color: #ef4444; cursor: pointer; padding: 8px 16px; border-radius: 8px; transition: 0.2s; display: inline-block; }
    .logout:hover { background: #fef2f2; }

    /* === 帳號卡片樣式 === */
    .user-profile { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 12px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
    .user-icon { width: 36px; height: 36px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .user-text { display: flex; flex-direction: column; }
    .user-name { font-size: 14px; font-weight: 700; color: #0f172a; }
    .badge-admin { font-size: 10px; background: #0f172a; color: #fff; padding: 1px 6px; border-radius: 4px; font-weight: 600; margin-top: 2px; width: fit-content; }

    .main { 
      background: transparent; 
      padding: 20px 24px; 
      display: flex; flex-direction: column; height: 100%; overflow: hidden; 
    }
    h2 { margin: 0; font-size: 28px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; flex-shrink: 0; }
    .muted { color: var(--text-muted); font-size: 13px; margin-top: 6px; margin-bottom: 12px; flex-shrink: 0; font-weight: 500; }
    
    /* 地圖卡片風格 */
    .map-card {
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: 20px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      flex: 1; min-height: 0;
      position: relative; overflow: hidden;
      display: flex; justify-content: center; align-items: center;
    }

    .map { width: 100%; height: 100%; display: block; object-fit: contain; }

    .tap-area { cursor: pointer; transition: all 0.2s ease; }
    .tap-area:hover circle.base { stroke-width: 4px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
    .tap-area:hover text { fill: #000; font-weight: 900; }

    /* Tooltip 樣式 */
    .map-tooltip {
      position: absolute; display: none; width: 280px; border-radius: 16px;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px);
      color: #334155; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid #e2e8f0; pointer-events: none; z-index: 50; overflow: hidden;
    }
    .t-header { padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .t-title { font-weight: 800; font-size: 15px; color: #0f172a; letter-spacing: 0.02em; }
    .t-icon { font-size: 14px; color: #64748b; }
    .t-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #e2e8f0; margin-bottom: 0; }
    .t-stat { background: #fff; padding: 12px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
    .t-stat-val { font-size: 20px; font-weight: 800; color: #0f172a; line-height: 1.2; }
    .t-stat-label { font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .t-unit { font-size: 12px; color: #94a3b8; font-weight: normal; margin-left: 2px;}
    .t-footer { padding: 12px 16px; border-top: 1px solid #e2e8f0; background: #fff; }
    .t-status-title { font-size: 11px; color: #94a3b8; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
    .t-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .t-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .t-tag.good { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .t-tag.warn { background: #fefce8; color: #ca8a04; border: 1px solid #fde047; }
    .t-tag.bad  { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }

    /* === 右側可收合 AI 助理 === */
    .ai-panel {
      background: #ffffff;
      border-left: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
      overflow: hidden;
      position: relative;
      box-shadow: -8px 0 24px rgba(15, 23, 42, 0.025);
    }

    .ai-rail {
      width: 64px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 10px;
      gap: 12px;
      background: #f8fafc;
      transition: opacity 0.18s ease, visibility 0.18s ease;
    }

    .ai-rail-button, .ai-collapse-btn {
      width: 42px;
      height: 42px;
      border: 1px solid #dbe3ec;
      border-radius: 14px;
      background: #ffffff;
      color: #0f172a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .ai-rail-button:hover, .ai-collapse-btn:hover {
      background: #f1f5f9;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.10);
      transform: translateY(-1px);
    }

    .ai-spark {
      font-size: 20px;
      line-height: 1;
    }

    .ai-rail-status {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 4px #d1fae5;
    }

    .ai-rail-label {
      margin-top: 2px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 0.16em;
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      user-select: none;
    }

    .ai-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      min-width: 360px;
      background: #fff;
      opacity: 0;
      visibility: hidden;
      transform: translateX(12px);
      transition: opacity 0.2s ease 0.08s, transform 0.28s ease, visibility 0.28s;
    }

    .dashboard-layout.ai-expanded .ai-rail {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .dashboard-layout.ai-expanded .ai-content {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }

    .ai-header {
      min-height: 76px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f8fafc;
    }
    .ai-title-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .ai-title { font-weight: 800; font-size: 18px; color: #0f172a; }
    .ai-subtitle { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .ai-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px rgba(16,185,129,0.6); flex: 0 0 auto; }
    .ai-collapse-btn { width: 38px; height: 38px; flex: 0 0 auto; font-size: 18px; }

    .ai-chat-body {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, #fbfdff 0%, #f8fafc 100%);
    }
    .chat-msg {
      max-width: 88%;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      word-wrap: break-word;
    }
    .chat-msg.bot {
      background: #ffffff;
      color: #1e293b;
      align-self: flex-start;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 12px rgba(15,23,42,0.04);
    }
    .chat-msg.user {
      background: #0f172a;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .ai-input-area {
      padding: 14px;
      border-top: 1px solid var(--border-light);
      background: #fff;
      display: flex;
      gap: 8px;
    }
    .ai-input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .ai-input:focus { border-color: #94a3b8; box-shadow: 0 0 0 3px #f1f5f9; }
    .ai-send-btn {
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s;
    }
    .ai-send-btn:hover { opacity: 0.92; transform: translateY(-1px); }

    @media (max-width: 1100px){
      .dashboard-layout{ grid-template-columns: 250px minmax(0, 1fr) 56px; }
      .dashboard-layout.ai-expanded{ grid-template-columns: 250px minmax(0, 1fr) 320px; }
      .ai-rail { width: 56px; padding-left: 7px; padding-right: 7px; }
      .ai-content { min-width: 320px; }
    }
    @media (max-width: 900px){
      .dashboard-layout{ grid-template-columns: 1fr; margin:0; border-radius:0; height: 100vh; }
      .sidebar{
        border-right: none;
        border-bottom: 1px solid var(--border-light);
        height: auto;
        position: relative;
        flex-direction: row;
        align-items: center;
        padding: 16px;
        flex-shrink: 0;
      }
      .brand { font-size: 24px; }
      .brand-sub, .logout-divider, .logout { display: none; }
      .menu { flex-direction: row; margin-top: 0; }
      .menu-item { padding: 8px 12px; font-size: 14px; }
      .map-card { flex: 1; }
      .ai-panel { display: none; }
    }
  </style>
</head>

<body>

    <!-- 1. 左側選單 (已修正 DOM 結構) -->
    <aside class="sidebar">
      <div>
        <div style="margin-bottom: 40px;">
          <div class="brand">BLE Mesh</div>
          <div class="brand-sub">smart restroom monitor</div>
        </div>
        <div class="menu">
          <a class="menu-item active" href="./select_node.html">主畫面</a>

    <main class="main">

      <div class="map-card">

          <defs>

    <!-- 3. 右側可收合 AI 對話視窗 -->
    <aside class="ai-panel" aria-label="AI 助理">
      <div class="ai-rail">
        <button id="ai-open" class="ai-rail-button" type="button" aria-label="展開 AI 助理" title="開啟 AI 助理">

            你好！我是 Jetson LLM 設備助理。您可以問我關於廁所環境狀況、衛生紙或洗手液補充提醒！
          </div>
        </div>

        <div class="ai-input-area">
          <input type="text" id="chat-input" class="ai-input" placeholder="詢問設備狀況，例如：廁所 01 狀況如何？" />

        </div>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
  
  <script>
  // ============================================
  // ★ 核心邏輯：地圖互動與數據更新
  // ============================================
  
  const SENSOR_LABEL = { temp: "溫度", hum: "濕度", mq135: "氣味", liquid: "洗手液", dist: "衛生紙" };

  function judgeLevel(key, value) {
    const v = Number(value);
    if (!Number.isFinite(v)) return null;
    
    if (key === "temp") {
      if (v >= 30) return { level: "bad", msg: `過高 (${v}°C)` };
      if (v >= 28) return { level: "warn", msg: `偏高 (${v}°C)` };
      return { level: "good", msg: `正常` };
    }
    if (key === "hum") {
      if (v >= 80) return { level: "bad", msg: `過高 (${v}%)` };
      if (v >= 70) return { level: "warn", msg: `偏高 (${v}%)` };
      if (v <= 35) return { level: "warn", msg: `偏低 (${v}%)` };
      return { level: "good", msg: `正常` };
    }
    if (key === "mq135") {
      if (v >= 140) return { level: "bad", msg: `極差 (${v})` };
      if (v >= 110) return { level: "warn", msg: `略高 (${v})` };
      return { level: "good", msg: `正常` };
    }
    if (key === "liquid") {
      if (v === 0) return { level: "bad", msg: `不足` };
      return { level: "good", msg: `充足` };
    }
    if (key === "dist") {
      if (v > 15) return { level: "bad", msg: `已用盡` };
      if (v >= 12) return { level: "warn", msg: `即將用盡` };
      return { level: "good", msg: `充足` };
    }
    return null;
  }

  const statusCache = { "JETSON_NANO_01": { envIndex: "--", sensors: {} }, "JETSON_NANO_02": { envIndex: "--", sensors: {} } };
  let activeTooltipState = null; 

  async function refreshStatus(nodeId) {
    try {
      const res = await fetch(`${API_BASE}/api/latest?node_id=${encodeURIComponent(nodeId)}`, { cache: "no-store" });
      if (!res.ok) return;
      const data = await res.json();
      
      const envIndex = data.env_score ?? "--";
      const sensors = data.sensors || {};
      
      statusCache[nodeId] = { envIndex, sensors };
    } catch (e) { }
  }

  async function refreshAllStatus() {
    await Promise.all([refreshStatus("JETSON_NANO_01"), refreshStatus("JETSON_NANO_02")]);
    if (activeTooltipState) {
        updateTooltipContent(activeTooltipState.nodeId, activeTooltipState.title);
    }
  }
  
  refreshAllStatus();
  setInterval(refreshAllStatus, 3000);

  const tooltip = document.getElementById("map-tooltip");
  const mapWrap = document.querySelector(".map-card");

  function updateTooltipContent(nodeId, titleText) {
    if (!tooltip) return;
    const s = statusCache[nodeId] || { sensors: {} };
    
    let alertsHtml = "";
    let hasAlerts = false;
    const keys = ["temp", "hum", "mq135", "liquid", "dist"];
    keys.forEach(k => {
      const val = s.sensors[k];
      const res = judgeLevel(k, val);
      if (res && (res.level === 'warn' || res.level === 'bad')) {
        hasAlerts = true;
        alertsHtml += `<div class="t-tag ${res.level}"><span>●</span> ${SENSOR_LABEL[k]} ${res.msg}</div>`;
      }
    });
    if (!hasAlerts) {
      alertsHtml = `<div class="t-tag good"><span>✓</span> 系統運作正常</div>`;
    }

    tooltip.innerHTML = `
      <div class="t-header"><div class="t-title">${titleText}</div><div class="t-icon">● Live</div></div>
      <div class="t-grid">
        <div class="t-stat"><div class="t-stat-val">${s.sensors.temp ?? "--"}<span class="t-unit">°C</span></div><div class="t-stat-label">即時溫度</div></div>
        <div class="t-stat"><div class="t-stat-val" style="color:${getScoreColor(s.envIndex)}">${s.envIndex ?? "--"}</div><div class="t-stat-label">環境指數</div></div>
      </div>
      <div class="t-footer"><div class="t-status-title">即時狀態監控</div><div class="t-tags">${alertsHtml}</div></div>
    `;
  }

  function getScoreColor(score) {
    if (score == "--") return "#0f172a";
    if (score >= 90) return "#059669"; 
    if (score >= 70) return "#ca8a04"; 
    return "#dc2626"; 
  }

  function showTooltip(nodeId, titleText, clientX, clientY) {
    if (!tooltip || !mapWrap) return;
    activeTooltipState = { nodeId, title: titleText };
    updateTooltipContent(nodeId, titleText);
    tooltip.style.display = "block";
    moveTooltip(clientX, clientY);
  }

  function moveTooltip(clientX, clientY) {
    if (!tooltip || !mapWrap) return;
    const rect = mapWrap.getBoundingClientRect();
    const pad = 12;
    let x = clientX - rect.left + 20; 
    let y = clientY - rect.top + 20;
    const maxX = rect.width - tooltip.offsetWidth - pad;
    const maxY = rect.height - tooltip.offsetHeight - pad;
    x = Math.max(pad, Math.min(maxX, x));
    y = Math.max(pad, Math.min(maxY, y));
    tooltip.style.left = `${x}px`;
    tooltip.style.top  = `${y}px`;
  }

  function hideTooltip() {
    if (!tooltip) return;
    activeTooltipState = null;
    tooltip.style.display = "none";
  }

  const r1 = document.getElementById("restroom-1");
  const r2 = document.getElementById("restroom-2");

  function bindHover(el, nodeId, titleText) {
    if (!el) return;
    el.addEventListener("mouseenter", (e) => showTooltip(nodeId, titleText, e.clientX, e.clientY));
    el.addEventListener("mousemove", (e) => moveTooltip(e.clientX, e.clientY));
    el.addEventListener("mouseleave", hideTooltip);
  }

  bindHover(r1, "JETSON_NANO_01", "廁所 01 (JETSON_NANO_01)");
  bindHover(r2, "JETSON_NANO_02", "廁所 02 (JETSON_NANO_02)");

  function goNode(nodeId){
    localStorage.setItem("selectedNode", nodeId);
    location.href = `./index.html?node_id=${nodeId}`;
  }

  function bindClick(el, nodeId){
    if (!el) return;
    el.addEventListener("click", () => goNode(nodeId));
  }

  bindClick(r1, "JETSON_NANO_01");
  bindClick(r2, "JETSON_NANO_02");

  // ============================================
  // ★ AI 對話互動邏輯 (對接 Jetson 後端 LLM)
  // ============================================
  const dashboardLayout = document.querySelector(".dashboard-layout");
  const aiOpenBtn = document.getElementById("ai-open");
  const aiCloseBtn = document.getElementById("ai-close");
  const aiContent = document.querySelector(".ai-content");

  function setAiExpanded(expanded) {
    if (!dashboardLayout || !aiContent) return;
    dashboardLayout.classList.toggle("ai-expanded", expanded);
    aiContent.setAttribute("aria-hidden", expanded ? "false" : "true");
    if (expanded) {
      window.setTimeout(() => document.getElementById("chat-input")?.focus(), 260);
    }
  }

  aiOpenBtn?.addEventListener("click", () => setAiExpanded(true));
  aiCloseBtn?.addEventListener("click", () => setAiExpanded(false));

  // 預設保持收合；Esc 可快速收回
  setAiExpanded(false);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && dashboardLayout?.classList.contains("ai-expanded")) {
      setAiExpanded(false);
      aiOpenBtn?.focus();
    }
  });

  const chatMessages = document.getElementById("chat-messages");
  const chatInput = document.getElementById("chat-input");
  const chatSend = document.getElementById("chat-send");

  function appendMessage(text, sender = "bot") {
    const msgDiv = document.createElement("div");
    msgDiv.className = `chat-msg ${sender}`;
    msgDiv.innerText = text;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  async function handleUserSend() {
    const text = chatInput.value.trim();
    if (!text) return;

    appendMessage(text, "user");
    chatInput.value = "";

    try {
      setTimeout(() => {
        if (text.includes("廁所 01") || text.includes("廁所1")) {
          const s1 = statusCache["JETSON_NANO_01"]?.sensors;
          appendMessage(`[Jetson 回覆] 廁所 01 目前溫度為 ${s1?.temp ?? '--'}°C，衛生紙與洗手液狀況良好。`, "bot");
        } else if (text.includes("廁所 02") || text.includes("廁所2")) {
          appendMessage(`[Jetson 回覆] 廁所 02 目前環境指數正常，維護人員半小時前剛完成巡視。`, "bot");
        } else {
          appendMessage(`[Jetson 回覆] 收到您的詢問："${text}"。目前各節點數據已即時同步至後端數據庫。`, "bot");
        }
      }, 600);
    } catch (err) {
      appendMessage("無法連接至 AI 服務，請確認 Jetson LLM 服務是否正常啟動。", "bot");
    }
  }

  chatSend.addEventListener("click", handleUserSend);
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleUserSend();
  });
  </script>
</body>
</html>
